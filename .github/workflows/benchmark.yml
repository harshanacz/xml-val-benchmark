name: XML Validation Multi-Platform Benchmark Matrix

on:
  workflow_dispatch:

jobs:
  benchmark-matrix:
    name: Benchmark (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Benchmark XML Fixtures
        run: node src/generate-fixtures.js

      - name: Execute Multi-Dimensional Benchmark Suite
        run: npm start

      - name: Upload Benchmark Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: README.md
